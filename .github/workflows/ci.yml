# Runs on every push and pull request.
#   test:      lint + unit tests
#   pipeline:  the whole pipeline end to end on FAKE data (the real data isn't in the repo):
#              clean -> train (MLflow + promotion gate) -> monitor -> Docker image -> call the API
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]" ruff
      - name: Lint
        run: ruff check src tests dashboard scripts --select E,F,I,B --line-length 130
      - name: Test
        run: pytest -q

  pipeline:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Fake data
        run: python -m airsense.synthetic data/raw/city_day.csv
      - name: Clean, train, monitor
        run: |
          python -m airsense.data
          python -m airsense.train
          python -m airsense.monitor
      - name: Build Docker image
        run: docker build -t airsense .
      - name: Start the API and request a forecast
        run: |
          docker run -d --name airsense -p 8000:8000 airsense
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/health && break; sleep 2; done
          curl -sf "http://127.0.0.1:8000/forecast/City0?as_of=2020-01-15" | tee out.json
          python -c "import json; d=json.load(open('out.json')); assert len(d['forecasts']) == 3, d"
      - name: Container logs on failure
        if: failure()
        run: docker logs airsense
