[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airsense"
version = "0.1.0"
description = "3-day PM2.5 forecasting for Indian cities with MLflow tracking, drift monitoring and a FastAPI/Streamlit front end"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "mlflow>=2.14",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.50", "plotly>=5.20"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:The argument .eval_set. is deprecated"]
